[project]
name = "aestheticbench-api"
version = "0.1.0"
description = "FastAPI backend for AestheticBench results viewer"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pandas>=2.2.0",
    "httpx>=0.27.0",
    "typer>=0.9.0",
    "tqdm>=4.66.0",
    "scikit-learn>=1.4.0",
    "textual>=0.50.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aestheticbench_api", "src/aesthetic_bench"]
