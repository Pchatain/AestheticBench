[project]
name = "aestheticbench"
version = "0.1.0"
description = "Will a language model commit to an aesthetic judgement, or retreat into relativism?"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "ipykernel>=7.2.0",
    "kaleido>=1.2.0",
    "aestheticbench-api",
    "plotly>=6.5.2",
]

[tool.uv.workspace]
members = ["packages/backend"]

[tool.uv.sources]
aestheticbench-api = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-mock>=3.15.1",
]
