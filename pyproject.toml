[project]
name = "moralbench"
version = "0.1.0"
description = "Package to measure the morality of LLMs"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "moralbench-api",
]

[tool.uv.workspace]
members = ["packages/backend"]

[tool.uv.sources]
moralbench-api = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-mock>=3.15.1",
]
