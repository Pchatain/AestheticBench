[project]
name = "aestheticbench"
version = "0.1.0"
description = "Will a language model commit to an aesthetic judgement, or retreat into relativism?"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "ipykernel>=7.2.0",
    "kaleido>=1.2.0",
    "pandas>=2.2.0",
    "plotly>=6.5.2",
    "scikit-learn>=1.4.0",
    "textual>=0.50.0",
    "tqdm>=4.66.0",
    "typer>=0.9.0",
    "uvicorn[standard]>=0.32.0",
]

[project.scripts]
aestheticbench = "aestheticbench.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aestheticbench"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-mock>=3.15.1",
]
